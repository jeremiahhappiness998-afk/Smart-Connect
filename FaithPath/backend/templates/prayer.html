{% extends "layout.html" %}

{% block content %}
<h2>Prayer and Expectation</h2>

<ul class="nav nav-pills nav-fill gap-2 p-1 small bg-primary rounded-5 shadow-sm" id="pillNav2" role="tablist" style="--bs-nav-link-color: var(--bs-white); --bs-nav-pills-link-active-color: var(--bs-primary); --bs-nav-pills-link-active-bg: var(--bs-white);">
            <li class="nav-item" role="presentation">
                <a class="nav-link rounded-5" id="home-tab2" href="/" type="button" role="tab" aria-selected="true">Home</a>
            </li>
            <li class="nav-item" role="presentation">
                <a class="nav-link rounded-5" id="encouragement-tab2" href="/word" type="button" role="tab" aria-selected="true">Word</a>
            </li>

            <li class="nav-item" role="presentation">
                <a class="nav-link active rounded-5" id="encouragement-tab2" href="/prayer" type="button" role="tab" aria-selected="true">Prayer</a>
            </li>

        </ul>


<form method="post">
    <textarea style="border-radius: 5px;" name="content" required></textarea>
    <button type="submit">Save</button>
</form>

<ul>
    {% for prayer in prayers %}
        <li>{{ prayer.content }} <small>({{ prayer.created_at.strftime('%Y-%m-%d %H:%M') }})</small></li>
    {% endfor %}
</ul>
{% endblock %}
